name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and re-upload (leave empty to only run CI)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Browser regressions
        run: node tests/browser.mjs
        env:
          CHROME_BIN: google-chrome
      - uses: actions/upload-artifact@v7
        with:
          name: styler
          path: dist/styler.js
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create automation token
        id: automation-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Update release PR or publish merged release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.automation-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: main

  release-build:
    needs: release
    if: >-
      !cancelled() &&
      (needs.release.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-ref.outputs.tag_name }}
      sha: ${{ steps.release-ref.outputs.sha }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name || inputs.release_tag }}
    steps:
      - name: Resolve published release to an immutable commit
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-ref.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting is checked in normal CI, not when rebuilding a historical release.
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        with:
          name: styler-release
          path: dist/styler.js
          if-no-files-found: error
          overwrite: true

  publish:
    needs: release-build
    if: ${{ !cancelled() && needs.release-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-asset-${{ needs.release-build.outputs.tag_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-build.outputs.tag_name }}
      BUILD_SHA: ${{ needs.release-build.outputs.sha }}
    steps:
      - name: Check release matches the verified build
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName
          release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$release_sha" != "$BUILD_SHA" ]]; then
            echo "::error::Release $RELEASE_TAG points to $release_sha, but CI verified $BUILD_SHA. Retry with release_tag=$RELEASE_TAG."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: styler-release
          path: dist
      - name: Attach installable JavaScript to the release
        run: gh release upload "$RELEASE_TAG" dist/styler.js --clobber

  validate-hacs:
    needs: [release-build, publish]
    if: >-
      !cancelled() &&
      (needs.publish.result == 'success' ||
       (needs.release-build.result == 'skipped' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false
